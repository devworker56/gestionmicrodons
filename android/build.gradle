buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Add this allprojects section - it's missing in your file!
allprojects {
    repositories {
        google()
        mavenCentral()
        
        // Add JitPack repository (required for many React Native libraries)
        maven { url 'https://www.jitpack.io' }
        
        // Add Maven Central explicitly (sometimes needed)
        maven {
            url = uri("https://repo.maven.apache.org/maven2/")
        }
        
        // Add the specific repository for async-storage
        maven {
            url = uri("https://storage.googleapis.com/r8-releases/raw")
        }
        
        // This is important - Android's default repository
        maven {
            url = uri("https://maven.google.com")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"